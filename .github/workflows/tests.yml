name: Tests and UI Execution

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:3000/"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
      - name: Execute all UI scenarios
        env:
          JUICE_SHOP_BASE_URL: http://127.0.0.1:3000
          JUICE_SHOP_HEADLESS: "true"
        run: python run.py --all
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-execution
          path: |
            reports/executions/**
            screenshots/**
          if-no-files-found: warn
